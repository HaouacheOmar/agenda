# Render Blueprint: Django API (database on Neon, frontend on Cloudflare Pages).
services:
  - type: web
    name: agendaops-api
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    rootDir: Agenda_app/agenda_web_app
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn Agenda_app.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /event/eventlists/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      # Neon connection string (postgresql://...?sslmode=require), entered in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      # Frontend origin(s), e.g. https://agendaops.pages.dev
      - key: CORS_ALLOWED_ORIGINS
        sync: false
